<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Smart Campus</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #080808;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 90%;
            max-width: 430px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .logo span {
            color: #00e5ff;
        }

        .tag {
            display: block;
            width: fit-content;
            margin: 0 auto 15px;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        input {
            background: #080808;
            border: 1px solid #333;
            color: white;
            padding: 13px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #00e5ff;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #00e5ff;
            color: #001014;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #888;
            font-size: 13px;
        }

        .login-link a {
            color: #00e5ff;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover,
        .login-link a:hover {
            color: #00e5ff;
        }
        #rollError {
    color: #ff6b6b;
    font-size: 12px;
    margin-top: 6px;
    display: block;
}

    </style>

</head>

<body>

    <div class="register-card">

        <div class="logo">
            SMART<span>CAMPUS</span>
        </div>

        <div class="tag">
            STUDENT PORTAL
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your student account to access the campus service portal.
        </p>

        <form action="register" method="post">

            <div class="form-group">
                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">

    <label>Roll Number</label>

    <input
        type="text"
        id="rollNumber"
        name="roll_number"
        placeholder="Enter your 10-character roll number"
        maxlength="10"
        minlength="10"
        pattern="[A-Za-z0-9]{10}"
        title="Roll number must contain exactly 10 letters and numbers"
        required>

    <small id="rollError"></small>

</div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>
            </div>

            <button
                type="submit"
                class="register-btn">
                CREATE ACCOUNT
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>
    <script>

const rollInput = document.getElementById("rollNumber");
const rollError = document.getElementById("rollError");

rollInput.addEventListener("input", function () {

    const rollNumber = rollInput.value;

    // Empty input
    if (rollNumber.length === 0) {

        rollError.textContent = "";

    }

    // Less than 10 characters
    else if (rollNumber.length < 10) {

        rollError.style.color = "#ff6b6b";

        rollError.textContent =
            "Roll number must contain exactly 10 characters. You entered "
            + rollNumber.length + " characters.";

    }

    // Invalid characters
    else if (!/^[A-Za-z0-9]{10}$/.test(rollNumber)) {

        rollError.style.color = "#ff6b6b";

        rollError.textContent =
            "Only letters and numbers are allowed.";

    }

    // Valid roll number
    else {

        rollError.style.color = "#00e5ff";

        rollError.textContent = "✓ Valid roll number";

    }

});

</script>

</body>

</html>
