<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Smart Campus</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #080808;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 90%;
            max-width: 430px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 40px;
            margin: 20px 0;
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .logo span {
            color: #00e5ff;
        }

        .tag {
            display: block;
            width: fit-content;
            margin: 0 auto 15px;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        input {
            background: #080808;
            border: 1px solid #333;
            color: white;
            padding: 13px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #00e5ff;
        }

        #rollError {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 6px;
            min-height: 16px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #00e5ff;
            color: #001014;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #888;
            font-size: 13px;
        }

        .login-link a {
            color: #00e5ff;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover,
        .login-link a:hover {
            color: #00e5ff;
        }

    </style>

</head>

<body>

    <div class="register-card">

        <div class="logo">
            SMART<span>CAMPUS</span>
        </div>

        <div class="tag">
            STUDENT PORTAL
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your student account to access the campus service portal.
        </p>

        <form id="registerForm" action="register" method="post">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label>Roll Number</label>

                <input
                    type="text"
                    id="rollNumber"
                    name="roll_number"
                    placeholder="Enter your 10-character roll number"
                    maxlength="10"
                    minlength="10"
                    pattern="[A-Za-z0-9]{10}"
                    title="Roll number must contain exactly 10 letters or numbers"
                    required>

                <small id="rollError"></small>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>
<div class="form-group">
    <button type="button" id="sendOtpBtn">Send OTP</button>
</div>

<div class="form-group" id="otpSection" style="display:none;">
    <label>Enter OTP</label>
    <input
        type="text"
        id="otpInput"
        maxlength="6"
        placeholder="Enter 6-digit OTP">

    <button type="button" id="verifyOtpBtn">Verify OTP</button>

    <p id="otpMessage"></p>
</div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <button
                type="submit"
                class="register-btn">

                CREATE ACCOUNT

            </button>

        </form>


        <p class="login-link">

            Already have an account?

            <a href="login.html">Login</a>

        </p>


        <a href="index.html" class="back">

            ← Back to Home

        </a>

    </div>
<script>
    const registerForm = document.getElementById("registerForm");
    const rollInput = document.getElementById("rollNumber");
    const rollError = document.getElementById("rollError");

    function validateRollNumber() {

        const rollNumber = rollInput.value.trim();

        if (rollNumber.length === 0) {
            rollError.textContent = "";
            return false;
        }

        if (rollNumber.length < 10) {
            rollError.style.color = "#ff6b6b";
            rollError.textContent =
                "Roll number must contain exactly 10 characters. You entered "
                + rollNumber.length + " characters.";
            return false;
        }

        if (rollNumber.length > 10) {
            rollError.style.color = "#ff6b6b";
            rollError.textContent =
                "Roll number must contain exactly 10 characters.";
            return false;
        }

        if (!/^[A-Za-z0-9]{10}$/.test(rollNumber)) {
            rollError.style.color = "#ff6b6b";
            rollError.textContent =
                "Only uppercase letters, lowercase letters, and numbers are allowed.";
            return false;
        }

        rollError.style.color = "#00e5ff";
        rollError.textContent = "✓ Valid roll number";

        return true;
    }

    // SHOW MESSAGE WHILE TYPING
    rollInput.addEventListener("input", function () {
        validateRollNumber();
    });

    // ALSO VALIDATE WHEN USER LEAVES THE FIELD
    rollInput.addEventListener("blur", function () {
        validateRollNumber();
    });

    // BLOCK FORM SUBMISSION IF INVALID
    registerForm.addEventListener("submit", function (event) {

        if (!validateRollNumber()) {
            event.preventDefault();
            rollInput.focus();
        }

    });
</script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
    emailjs.init({
        publicKey: "98mu0otivhbGy7jlk"
    });
</script>
    <script>
let generatedOTP = "";
let otpVerified = false;

const form = document.querySelector("form");
const emailInput = document.querySelector('input[name="email"]');
const nameInput = document.querySelector('input[name="name"]');

const sendOtpBtn = document.getElementById("sendOtpBtn");
const verifyOtpBtn = document.getElementById("verifyOtpBtn");
const otpSection = document.getElementById("otpSection");
const otpInput = document.getElementById("otpInput");
const otpMessage = document.getElementById("otpMessage");

sendOtpBtn.addEventListener("click", function () {

    const email = emailInput.value.trim();
    const name = nameInput.value.trim();

    if (email === "") {
        alert("Please enter your email first.");
        emailInput.focus();
        return;
    }

    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

    const currentTime = new Date();
    currentTime.setMinutes(currentTime.getMinutes() + 15);

    const timeText = currentTime.toLocaleTimeString();

    emailjs.send(
        "service_r6w38i9",
        "template_k4lgpnn",
        {
            to_email: email,
            to_name: name,
            passcode: generatedOTP,
            time: timeText
        }
    )
    .then(function () {
        alert("OTP sent successfully. Check your email.");

        otpSection.style.display = "block";
        otpMessage.textContent = "OTP sent. Please check your email.";
        otpMessage.style.color = "green";
    })
    .catch(function (error) {
        console.error("EmailJS Error:", error);
        alert("Unable to send OTP. Please try again.");
    });
});

verifyOtpBtn.addEventListener("click", function () {

    const enteredOTP = otpInput.value.trim();

    if (enteredOTP === generatedOTP && generatedOTP !== "") {
        otpVerified = true;

        otpMessage.textContent = "Email verified successfully!";
        otpMessage.style.color = "green";

        alert("Email verified successfully!");
    } else {
        otpMessage.textContent = "Incorrect OTP. Please try again.";
        otpMessage.style.color = "red";
    }
});

form.addEventListener("submit", function (event) {

    if (!otpVerified) {
        event.preventDefault();
        alert("Please verify your email using OTP before creating your account.");
    }
});
</script>
</body>

</html>
