<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Smart Campus</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #080808;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 90%;
            max-width: 430px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .logo span {
            color: #00e5ff;
        }

        .tag {
            display: block;
            width: fit-content;
            margin: 0 auto 15px;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #ddd;
        }

        input {
            background: #080808;
            border: 1px solid #333;
            color: white;
            padding: 13px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #00e5ff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #00e5ff;
            color: #001014;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.2);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #00e5ff;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            SMART<span>CAMPUS</span>
        </div>

        <div class="tag">
            STUDENT PORTAL
        </div>

        <h1>Student Login</h1>

        <p class="subtitle">
            Login to view and track your campus service requests.
        </p>

        <form action="login" method="post">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button
                type="submit"
                class="login-btn">
                LOGIN
            </button>

        </form>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

</body>
</html>
